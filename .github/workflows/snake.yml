name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permission to write to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Snake
        # --------------------------------------------------
        # FIXED: Upgraded from @v2 to @v3
        # --------------------------------------------------
        uses: Platane/snk@v3 
        with:
          github_user_name: invins2003
          # --------------------------------------------------
          # FIXED: Changed 'svg_out_path' to 'outputs'
          # This path MUST match the <img> src in your README.md
          # --------------------------------------------------
          outputs: assets/github-contribution-grid-snake.svg

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-grid-snake.svg
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update snake animation"
            git push
          fi
